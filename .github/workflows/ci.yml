# Runs on GitHub and on Forgejo Actions (which reads .github/workflows when
# there is no .forgejo/workflows). The runner labels are GitHub's hosted
# ones; a Forgejo runner needs the same labels, or edit runs-on.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: flake eval (all systems)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build --all-systems -L

  checks:
    name: checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: package (pytest runs in its check phase), unit-name, hm-assert
        run: |
          sys=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix build -L --no-link \
            ".#checks.$sys.package" \
            ".#checks.$sys.unit-name" \
            ".#checks.$sys.hm-assert"
      - name: filter bench (every preset under 100 ms/frame)
        run: nix shell .#floficam -c floficam-filter-bench

  vm:
    name: NixOS VM test (v4l2loopback, hotplug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L --no-link .#checks.x86_64-linux.vm

  lint:
    name: formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix formatting (nixfmt)
        run: nix fmt -- --ci
      - name: python (pyflakes and syntax errors only)
        run: nix shell --inputs-from . nixpkgs#ruff -c ruff check --select F,E9 .
