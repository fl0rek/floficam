[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "floficam"
version = "0.1.0"
description = "Feeds a v4l2loopback camera device with real frames, effects or SMPTE bars"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
dependencies = ["pygobject", "numpy"]

[project.scripts]
floficam = "floficam.cli:main"
floficam-daemon = "floficam.main:main"
floficam-filter = "floficam.filter.child:main"
floficam-filter-bench = "floficam.filter.bench:main"
floficam-filter-preview = "floficam.filter.preview:main"
floficam-reader = "floficam.reader:main"

[tool.setuptools]
packages = ["floficam", "floficam.filter"]

[tool.setuptools.package-data]
"floficam.filter" = ["presets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
